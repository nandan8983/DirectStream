name: Build & Release DirectStream APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Required to create/update GitHub Releases and push tags
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout full history so we can push tags
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Extract version & build number from pubspec.yaml
      #    pubspec format:  version: 0.0.4+4
      #    Produces:        VERSION=0.0.4+4   TAG=v0.0.4+4
      # -----------------------------------------------------------------------
      - name: Extract version from pubspec.yaml
        id: version
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version://' | tr -d ' \r\n')
          echo "VERSION=$RAW"  >> $GITHUB_OUTPUT
          echo "TAG=v$RAW"     >> $GITHUB_OUTPUT
          BUILD=$(echo "$RAW" | cut -d'+' -f2)
          echo "BUILD=$BUILD"  >> $GITHUB_OUTPUT
          echo "Detected version: $RAW  tag: v$RAW  build: $BUILD"

      # -----------------------------------------------------------------------
      # 3. Java + Flutter toolchain
      # -----------------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # -----------------------------------------------------------------------
      # 4. Bootstrap Android scaffolding (creates android/ folder)
      # -----------------------------------------------------------------------
      - name: Initialize Android scaffolding
        run: |
          rm -rf android
          flutter create . --project-name tv_cast_app --platforms=android
          cp android_manifest_template.xml android/app/src/main/AndroidManifest.xml

      # -----------------------------------------------------------------------
      # 5. Configure RELEASE SIGNING so every build has the same signature.
      #    Without this, Android refuses OTA updates with "package conflict".
      #
      #    The keystore/directstream.jks file is committed to the repo —
      #    this is safe for a non-Play-Store sideloaded app.
      # -----------------------------------------------------------------------
      - name: Configure release signing
        run: |
          # Copy key.properties where Gradle expects it (android/ root)
          cp keystore/key.properties android/key.properties
          # Copy keystore into both android/ and android/app/ for foolproof path resolution
          cp keystore/directstream.jks android/directstream.jks
          cp keystore/directstream.jks android/app/directstream.jks
          # Run the shared patch script (supports both build.gradle.kts and build.gradle)
          python3 patch_gradle.py

      # -----------------------------------------------------------------------
      # 6. Install Dart/Flutter dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: flutter pub get

      # -----------------------------------------------------------------------
      # 7. Generate launcher icons
      # -----------------------------------------------------------------------
      - name: Generate app launcher icons
        run: dart run flutter_launcher_icons

      # -----------------------------------------------------------------------
      # 8. Build a signed RELEASE APK
      # -----------------------------------------------------------------------
      - name: Build signed release APK
        run: flutter build apk --release

      # -----------------------------------------------------------------------
      # 9. Rename APK to include version tag
      # -----------------------------------------------------------------------
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/DirectStream-${{ steps.version.outputs.TAG }}.apk
          echo "APK ready: dist/DirectStream-${{ steps.version.outputs.TAG }}.apk"
          ls -lh dist/

      # -----------------------------------------------------------------------
      # 10. Delete any pre-existing release+tag so we can re-release same version
      # -----------------------------------------------------------------------
      - name: Delete existing release and tag (if any)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.version.outputs.TAG }}" --yes 2>/dev/null || true
          git push origin ":refs/tags/${{ steps.version.outputs.TAG }}" 2>/dev/null || true

      # -----------------------------------------------------------------------
      # 11. Publish GitHub Release with the APK as a downloadable asset
      #     The in-app auto-updater checks /releases/latest for this.
      # -----------------------------------------------------------------------
      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "DirectStream ${{ steps.version.outputs.TAG }}"
          body: |
            ## DirectStream ${{ steps.version.outputs.TAG }}

            Auto-built and signed release from commit `${{ github.sha }}`

            ### How to install / update
            1. Download **DirectStream-${{ steps.version.outputs.TAG }}.apk** below.
            2. On your Android device → Settings → **Install unknown apps** → allow your browser/file manager.
            3. Open the downloaded APK and tap **Install**.

            > **Existing users:** The in-app **Check Update** button detects this release automatically and installs it over the existing app (same signing key — no uninstall needed).
          files: dist/DirectStream-${{ steps.version.outputs.TAG }}.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
